services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: pf, POSTGRES_PASSWORD: pf, POSTGRES_DB: promptfunds }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pf"], interval: 5s, retries: 10 }
    ports: ["5432:5432"]
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pf:pf@db:5432/promptfunds
      DIRECT_URL: postgresql://pf:pf@db:5432/promptfunds
    ports: ["3000:3000"]
volumes:
  pgdata:
